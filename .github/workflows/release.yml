name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc build-essential gcc-multilib \
            git e2fsprogs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Rust targets
        run: rustup target add i686-unknown-linux-musl

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            kernel/rust/target/
            user/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build wishy OS
        run: make all

      - name: Verify disk image was created
        run: |
          if [ -f build/wishy.img ]; then
            echo "✓ Disk image built successfully"
            ls -lh build/wishy.img
          else
            echo "✗ Disk image not found"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/wishy.img
          body: |
            # wishy OS Release ${{ github.ref_name }}

            This release contains the bootable disk image for wishy OS.

            ## Usage

            Run the OS using QEMU:
            ```bash
            qemu-system-i386 -drive format=raw,file=wishy.img \
              -m 256M -serial stdio -vga std
            ```

            For more information, see the [README](https://github.com/sahilarun/wishy/blob/main/README.md).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
